version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aaguardian
      POSTGRES_PASSWORD: aaguardian_dev_password
      POSTGRES_DB: aaguardian
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://aaguardian:aaguardian_dev_password@db:5432/aaguardian
      JWT_SECRET_KEY: change-me-in-production
    depends_on:
      - db
volumes:
  pgdata:
